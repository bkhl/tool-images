---
on:
  push:
    branches:
      - main
  schedule:
    - cron: "23 23 * * *"
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image:
          - json-lsp
          - lua-language-server
          - clangd
          - prettier
    steps:
      - uses: actions/checkout@v7

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.image }}
          file: ${{ matrix.image }}/Containerfile
          push: true
          tags: ghcr.io/${{ github.repository }}/${{ matrix.image }}:latest
